apiVersion: apps/v1
kind: Deployment
metadata:
  name: willow-slate-service
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/jacksondprice/willow-slate-service:1.4.0
          envFrom:
            - secretRef:
                name: app-secrets
